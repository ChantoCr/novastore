services:
  mysql:
    image: mysql:8.4
    container_name: nova-store-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: nova-store-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: nova-store-client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    depends_on:
      - server

volumes:
  mysql_data:
  server_node_modules:
  client_node_modules:
